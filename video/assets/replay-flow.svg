<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Kujo native replay flow</title>
  <desc id="desc">An issue request hashes to a cassette. Kujo passes its recorded reply to a policy and checks the decision against a fixed oracle.</desc>
  <defs>
    <marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#ddd" />
    </marker>
  </defs>
  <rect width="1280" height="360" fill="#101010" />
  <g fill="#181818" stroke="#ddd" stroke-width="2">
    <rect x="42" y="123" width="245" height="110" rx="5" />
    <rect x="349" y="123" width="245" height="110" rx="5" />
    <rect x="656" y="123" width="245" height="110" rx="5" />
    <rect x="963" y="123" width="275" height="110" rx="5" />
  </g>
  <g fill="none" stroke="#ddd" stroke-width="2" marker-end="url(#arrow)">
    <path d="M287 178 H341" />
    <path d="M594 178 H648" />
    <path d="M901 178 H955" />
  </g>
  <g fill="#f5f5f5" text-anchor="middle" font-family="monospace" font-size="21">
    <text x="164" y="171">Issue request</text>
    <text x="471" y="171">Native cassette</text>
    <text x="778" y="171">Triage policy</text>
    <text x="1100" y="171">Decision checks</text>
  </g>
  <g fill="#bdbdbd" text-anchor="middle" font-family="monospace" font-size="16">
    <text x="164" y="200">Request SHA-256</text>
    <text x="471" y="200">Recorded reply</text>
    <text x="778" y="200">Candidate config</text>
    <text x="1100" y="200">Fixed oracle</text>
  </g>
</svg>
