name: Replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canvas:
    name: Canvas tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: canvas
      - run: npm test
        working-directory: canvas

  native-replay:
    name: Native replay (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [original, latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Resolve Kujo release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          tag=v1.9.0
          if [[ "$RUNTIME" == latest ]]; then
            tag=$(gh api repos/kujolang/kujo/releases/latest --jq .tag_name)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: kujolang/kujo/.github/actions/setup-kujo@2cfaf185ad03059c89ef4f72fb061074255d00fc
        id: kujo
        with:
          version: ${{ steps.release.outputs.tag }}
      - name: Check Kujo source and test offline
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: |
          git ls-files '*.kujo' | while IFS= read -r file; do
            "$KUJO_BIN" check "$file"
          done
          tools/lab test
          (cd examples/invoice && ../../tools/replay replay cassettes test-run route_test.kujo)
      - name: Reproduce experiment decisions and reports
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: |
          mkdir -p .scratch
          tools/lab search .scratch/ci-sweep
          tools/lab final .scratch/ci-sweep
          tools/lab verify results .scratch/ci-sweep --behavior
          tools/lab report results .scratch/ci-visual-data
          python3 tools/compare-visual-data.py video/visual-data .scratch/ci-visual-data
